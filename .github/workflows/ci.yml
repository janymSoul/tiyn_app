name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          flutter gen-l10n
          git diff --exit-code
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Test
        run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          cache: true
      - run: flutter pub get
      # env/*.json is gitignored; build it from the repo secret.
      - name: Write env/staging.json
        env:
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: |
          mkdir -p env
          printf '{"FLAVOR":"staging","API_BASE_URL":"https://api-staging.tiyn.dev","GOOGLE_SERVER_CLIENT_ID":"%s"}' "$GOOGLE_SERVER_CLIENT_ID" > env/staging.json
      - name: Build staging APK
        run: flutter build apk --debug --flavor staging --dart-define-from-file=env/staging.json
      - uses: actions/upload-artifact@v4
        with:
          name: app-staging-debug
          path: build/app/outputs/flutter-apk/app-staging-debug.apk
          retention-days: 7
